name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      # Структура как локально: rivet со вложенным rivet-web.
      - uses: actions/checkout@v7
        with:
          repository: PavluninVladimir/rivet
          path: rivet
      - uses: actions/checkout@v7
        with:
          path: rivet/rivet-web
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet/rivet-service/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: rivet/rivet-web
      - run: npx playwright install --with-deps chromium
        working-directory: rivet/rivet-web
      - run: npx playwright test
        working-directory: rivet/rivet-web
        env:
          RIVET_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet?sslmode=disable
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            rivet/rivet-web/playwright-report
            rivet/rivet-web/test-results
